server:
  port: ${HUB_SERVER_PORT}

spring:
  application:
    name: hub-service
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      schema: hub
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    defer-datasource-initialization: true # hibernate가 초기화되기 전 data.sql 실행하는 것을 방지
  config:
    import: file:.env[.properties]
  sql:
    init:
      mode: always
      data-locations: classpath:hub_data.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  zipkin:
    tracing:
      endpoint: "http://localhost:9411/api/v2/spans"
  tracing:
    sampling:
      probability: 1.0

naver:
  api:
    client-id: ${NAVER_MAP_API_KEY_ID}
    client-secret: ${NAVER_MAP_API_KEY}